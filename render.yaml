# =====================================================================
# Render Blueprint Specification for AdSync Control Center (100% Free Tier)
# =====================================================================
version: "1"

envVarGroups:
  - name: adsync-shared-env
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FORCE_MOCK_MODE
        value: "1"
      - key: INSTAGRAM_DRY_RUN
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: adsync-reels
      - key: DATABASE_URL
        sync: false

services:
  # 1. Web Service: AdSync Control Center Dashboard & FastAPI Backend
  - type: web
    name: adsync-control-center
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: adsync-shared-env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WORKER_MODE
        value: cloud
      - key: RENDER_WORKER_URL
        fromService:
          type: web
          name: adsync-render-worker
          property: host

  # 2. Web Service: AdSync Cloud Video Rendering Worker
  - type: web
    name: adsync-render-worker
    env: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: adsync-shared-env
