# =====================================================================
# Render Blueprint Specification for AdSync Control Center (100% FREE TIER)
# =====================================================================
version: "1"

services:
  # FastAPI Dashboard & Control Center Backend (Free Instance: $0/month)
  - type: web
    name: adsync-control-center
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: FORCE_MOCK_MODE
        value: "1"
      - key: INSTAGRAM_DRY_RUN
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: adsync-reels
      - key: DATABASE_URL
        sync: false
      - key: WORKER_MODE
        value: local
